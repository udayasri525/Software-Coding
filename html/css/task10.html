<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess Board - Flex</title>
    <link rel="stylesheet" href="task10.css">
</head>
<body>

<div class="chessboard">
    <!-- Row 1 -->
    <div class="row">
        <div class="box">♜</div>
        <div class="box">♞</div>
        <div class="box">♝</div>
        <div class="box">♛</div>
        <div class="box">♚</div>
        <div class="box">♝</div>
        <div class="box">♞</div>
        <div class="box">♜</div>
    </div>
    <!-- Row 2 -->
    <div class="row">
        <div class="box">♟</div>
        <div class="box">♟</div>
        <div class="box ">♟</div>
        <div class="box">♟</div>
        <div class="box ">♟</div>
        <div class="box ">♟</div>
        <div class="box ">♟</div>
        <div class="box ">♟</div>
    </div>
    <!-- Row 3 -->
    <div class="row">
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    </div>
    <!-- Row 4 -->
    <div class="row">
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    </div>
    <!-- Row 5 -->
    <div class="row">
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    </div>
    <!-- Row 6 -->
    <div class="row">
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
        <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    </div>
    
    <!-- ROW 7 (White pawns) -->
    <div class="row">
        <div class="box black">♙</div>
        <div class="box white">♙</div>
        <div class="box black">♙</div>
        <div class="box white">♙</div>
        <div class="box black">♙</div>
        <div class="box white">♙</div>
        <div class="box black">♙</div>
        <div class="box white">♙</div>
    </div>

    <!-- ROW 8 (White major pieces) -->
    <div class="row">
        <div class="box white">♖</div>
        <div class="box black">♘</div>
        <div class="box white">♗</div>
        <div class="box black">♕</div>
        <div class="box white">♔</div>
        <div class="box black">♗</div>
        <div class="box white">♘</div>
        <div class="box black">♖</div>
</div>

</body>
</html>
